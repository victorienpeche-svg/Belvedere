name: Mise a jour des actualites
on:
  schedule:
    - cron: "0 5 * * *"   # 6h00 a Paris (heure d'hiver) tous les jours
  workflow_dispatch:      # permet de lancer a la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generer news.json depuis les flux RSS
        run: python fetch_news.py
      - name: Pousser les changements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualisation automatique des dépêches"
          file_pattern: news.json
